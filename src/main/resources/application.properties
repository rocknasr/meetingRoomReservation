spring.application.name=reservation

spring.datasource.url=jdbc:sqlite:./base.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Le schema est entierement gere par Flyway. La validation Hibernate est desactivee
# car SQLite impose le type INTEGER pour une cle primaire auto-incrementee, la ou
# Hibernate attend BIGINT pour un identifiant Java de type Long.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

